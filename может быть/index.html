<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Тестовая оплата ЮKassa</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #f0f0f0; }
        .box { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1); text-align: center; }
        input { font-size: 18px; padding: 10px; width: 200px; margin-bottom: 20px; text-align: center; }
        button { font-size: 18px; padding: 10px 30px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Введите сумму для оплаты</h2>
        <input type="number" id="amount" placeholder="Например: 100" step="0.01" min="1">
        <br>
        <button onclick="pay()">Оплатить</button>
    </div>

    <script>
        async function pay() {
            const amount = document.getElementById('amount').value;
            if (!amount || amount <= 0) {
                alert('Введите корректную сумму');
                return;
            }

            try {
                const response = await fetch('/create-payment', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ amount: amount })
                });

                // ВАЖНО: получаем текст (HTML), а не JSON
                const html = await response.text();

                // Записываем HTML в документ — он сам сделает редирект
                document.open();
                document.write(html);
                document.close();
            } catch (error) {
                alert('Ошибка: ' + error.message);
            }
        }
    </script>
</body>
</html>
